<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Откуда Helm берёт значения"><title>Откуда Helm берёт значения</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="340" rx="16" fill="#0b1017"/><rect width="800" height="340" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Откуда Helm берёт значения</text><text x="38" y="57" fill="#7f91a3" font-size="12">каждый следующий слой перекрывает предыдущий</text><rect x="20.0" y="250.0" width="300.0" height="40.0" rx="10" fill="#7f91a3" fill-opacity="0.08" stroke="#7f91a3" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="275.0" fill="#7f91a3" font-size="11.5" font-weight="700" text-anchor="start">values.yaml внутри чарта</text><text x="340.0" y="275.0" fill="#7f91a3" font-size="10.5" font-weight="700" text-anchor="start">слабее всех</text><rect x="32.0" y="200.0" width="300.0" height="40.0" rx="10" fill="#2de2e6" fill-opacity="0.11" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="46.0" y="225.0" fill="#2de2e6" font-size="11.5" font-weight="700" text-anchor="start">-f values-base.yaml</text><rect x="44.0" y="150.0" width="300.0" height="40.0" rx="10" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="58.0" y="175.0" fill="#a78bfa" font-size="11.5" font-weight="700" text-anchor="start">-f values-prod.yaml</text><rect x="56.0" y="100.0" width="300.0" height="40.0" rx="10" fill="#ffb84d" fill-opacity="0.16999999999999998" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="70.0" y="125.0" fill="#ffb84d" font-size="11.5" font-weight="700" text-anchor="start">--set image.tag=1.4.2</text><text x="340.0" y="125.0" fill="#ffb84d" font-size="10.5" font-weight="700" text-anchor="start">сильнее всех</text><path d="M430.0 186.0 L450.0 186.0 L450.0 110.0 L470.0 110.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="474.0" y="80.0" width="150.0" height="60.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="488.0" y="104.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">values</text><text x="488.0" y="122.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">итоговые</text><rect x="474.0" y="156.0" width="150.0" height="60.0" rx="10" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-width="1.6" filter="url(#glow)"/><text x="488.0" y="180.0" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="start">templates/</text><text x="488.0" y="198.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">*.yaml + {{ }}</text><path d="M640.0 148.0 L664.0 148.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="668.0" y="108.0" width="112.0" height="80.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="682.0" y="132.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">манифесты</text><text x="682.0" y="150.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">helm template</text><text x="682.0" y="166.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">--dry-run</text><path d="M724.0 190.0 L724.0 250.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="668.0" y="254.0" width="112.0" height="40.0" rx="10" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="682.0" y="279.0" fill="#39ff88" font-size="11.5" font-weight="700" text-anchor="start">кластер</text><text x="20.0" y="326.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">Проверяй результат до установки: helm template ./chart -f values-prod.yaml | less</text></svg>
