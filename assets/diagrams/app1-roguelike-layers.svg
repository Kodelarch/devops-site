<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Три слоя приложения"><title>Три слоя приложения</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="320" rx="16" fill="#0b1017"/><rect width="800" height="320" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Три слоя приложения</text><text x="38" y="57" fill="#7f91a3" font-size="12">зависимости направлены к домену, домен не знает ни о ком</text><rect x="20.0" y="96.0" width="220.0" height="130.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="120.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">Interface</text><text x="34.0" y="139.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">команды терминала</text><text x="34.0" y="156.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">таблица статусов</text><text x="34.0" y="173.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">цветной вывод</text><rect x="290.0" y="86.0" width="220.0" height="150.0" rx="10" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="304.0" y="110.0" fill="#39ff88" font-size="14" font-weight="700" text-anchor="start">Domain</text><text x="304.0" y="129.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">Target, Result</text><text x="304.0" y="146.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">AlertPolicy</text><text x="304.0" y="163.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">правила: когда алерт</text><text x="304.0" y="180.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start"></text><text x="304.0" y="197.0" fill="#39ff88" font-size="11" font-weight="400" text-anchor="start">нет requests и print</text><rect x="560.0" y="96.0" width="220.0" height="130.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="574.0" y="120.0" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start">Infrastructure</text><text x="574.0" y="139.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">HTTP и TCP-проверки</text><text x="574.0" y="156.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">файл истории</text><text x="574.0" y="173.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">Telegram</text><path d="M242.0 160.0 L286.0 160.0" fill="none" stroke="#2de2e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><text x="264.0" y="150.0" fill="#2de2e6" font-size="10" font-weight="600" text-anchor="middle">знает</text><path d="M558.0 160.0 L514.0 160.0" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-violet)"/><text x="536.0" y="150.0" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">знает</text><text x="20.0" y="270.0" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">Поменять Telegram на Slack или терминал на веб — правится только свой слой.</text><text x="20.0" y="290.0" fill="#7f91a3" font-size="11.5" font-weight="400" text-anchor="start">Домен тестируется без сети и без файлов: тесты быстрые и не флапают.</text></svg>
