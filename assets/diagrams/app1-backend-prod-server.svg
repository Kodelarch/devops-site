<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Как запускают Flask на самом деле"><title>Как запускают Flask на самом деле</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="330" rx="16" fill="#0b1017"/><rect width="800" height="330" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Как запускают Flask на самом деле</text><text x="38" y="57" fill="#7f91a3" font-size="12">app.run() — учебный сервер; в работе — gunicorn за nginx</text><rect x="20.0" y="92.0" width="110.0" height="60.0" rx="10" fill="#7f91a3" fill-opacity="0.05" stroke="#7f91a3" stroke-width="1.6" filter="url(#glow)"/><text x="75.0" y="128.0" fill="#7f91a3" font-size="12" font-weight="700" text-anchor="middle">клиенты</text><rect x="170.0" y="82.0" width="140.0" height="80.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="184.0" y="106.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">nginx</text><text x="184.0" y="124.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">TLS, статика,</text><text x="184.0" y="141.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">таймауты</text><rect x="350.0" y="82.0" width="150.0" height="80.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="364.0" y="106.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">gunicorn</text><text x="364.0" y="124.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">master: следит</text><text x="364.0" y="141.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">и перезапускает</text><rect x="540.0" y="72.0" width="110.0" height="22.0" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="552.0" y="88.0" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="start">worker 1</text><rect x="540.0" y="98.0" width="110.0" height="22.0" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="552.0" y="114.0" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="start">worker 2</text><rect x="540.0" y="124.0" width="110.0" height="22.0" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="552.0" y="140.0" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="start">worker 3</text><rect x="540.0" y="150.0" width="110.0" height="22.0" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="552.0" y="166.0" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="start">worker 4</text><rect x="690.0" y="92.0" width="90.0" height="60.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="735.0" y="128.0" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="middle">app:app</text><path d="M132.0 122.0 L166.0 122.0" fill="none" stroke="#7f91a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M312.0 122.0 L346.0 122.0" fill="none" stroke="#2de2e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><path d="M502.0 122.0 L536.0 122.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M652.0 122.0 L686.0 122.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="20.0" y="210.0" width="760.0" height="74.0" rx="10" fill="#ff5470" fill-opacity="0.05" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="234.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">✗ app.run() в проде</text><text x="34.0" y="253.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">один запрос за раз · не переживает падений · «WARNING: This is a development server»</text><text x="20.0" y="312.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">workers ≈ 2 × ядра + 1 для начала, дальше — по замерам.</text></svg>
