<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Этажи файрвола в Linux"><title>Этажи файрвола в Linux</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="340" rx="16" fill="#0b1017"/><rect width="800" height="340" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Этажи файрвола в Linux</text><text x="38" y="57" fill="#7f91a3" font-size="12">ufw, iptables и nftables — не конкуренты, а слои одной конструкции</text><rect x="30.0" y="80.0" width="460.0" height="48.0" rx="10" fill="#ffb84d" fill-opacity="0.08" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="46.0" y="110.0" fill="#ffb84d" font-size="14" font-weight="800" text-anchor="start">ufw</text><text x="150.0" y="110.0" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">удобная обёртка: генерирует правила</text><rect x="30.0" y="138.0" width="460.0" height="48.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="46.0" y="168.0" fill="#a78bfa" font-size="14" font-weight="800" text-anchor="start">iptables</text><text x="150.0" y="168.0" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">старый синтаксис, работает через iptables-nft</text><rect x="30.0" y="196.0" width="460.0" height="48.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="46.0" y="226.0" fill="#2de2e6" font-size="14" font-weight="800" text-anchor="start">nftables</text><text x="150.0" y="226.0" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">современный движок правил</text><rect x="30.0" y="254.0" width="460.0" height="48.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="46.0" y="284.0" fill="#39ff88" font-size="14" font-weight="800" text-anchor="start">netfilter</text><text x="150.0" y="284.0" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">ядро: пакет пропускают или отбрасывают</text><rect x="592.4" y="85.0" width="95.2" height="22.0" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.2"/><text x="640.0" y="100.0" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">пакет на :22</text><path d="M640.0 110.0 L640.0 144.0" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="560.0" y="148.0" width="160.0" height="36.0" rx="8" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="640.0" y="171.0" fill="#39ff88" font-size="12" font-weight="700" text-anchor="middle">netfilter</text><path d="M616.0 186.0 L580.0 222.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M664.0 186.0 L700.0 222.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><rect x="552.2" y="225.0" width="55.6" height="22.0" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.2"/><text x="580.0" y="240.0" fill="#39ff88" font-size="11" font-weight="700" text-anchor="middle">ACCEPT</text><rect x="678.8" y="225.0" width="42.4" height="22.0" rx="6" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.2"/><text x="700.0" y="240.0" fill="#ff5470" font-size="11" font-weight="700" text-anchor="middle">DROP</text><text x="560.0" y="282.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="start">default deny:</text><text x="560.0" y="298.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">закрыто всё, кроме</text><text x="560.0" y="314.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">явно разрешённого</text></svg>
