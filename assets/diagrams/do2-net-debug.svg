<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="«Сайт не открывается»: порядок разбора"><title>«Сайт не открывается»: порядок разбора</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="390" rx="16" fill="#0b1017"/><rect width="800" height="390" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">«Сайт не открывается»: порядок разбора</text><text x="38" y="57" fill="#7f91a3" font-size="12">каждый шаг отсекает половину вариантов</text><rect x="30.0" y="76.0" width="470.0" height="56.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="100.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">1. Есть ли сеть вообще</text><text x="44.0" y="119.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">ip a · ip r · ping -c 3 1.1.1.1</text><rect x="556.0" y="82.0" width="224.0" height="44.0" rx="10" fill="#ff5470" fill-opacity="0.06" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="568.0" y="109.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">интерфейс, маршрут, шлюз</text><path d="M504.0 104.0 L550.0 104.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="527.0" y="97.0" fill="#ff5470" font-size="10" font-weight="600" text-anchor="middle">нет</text><path d="M120.0 134.0 L120.0 150.0" fill="none" stroke="#2de2e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><text x="132.0" y="146.0" fill="#2de2e6" font-size="10" font-weight="700" text-anchor="start">да</text><rect x="30.0" y="152.0" width="470.0" height="56.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="176.0" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start">2. Резолвится ли имя</text><text x="44.0" y="195.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">dig site.ru +short · resolvectl status</text><rect x="556.0" y="158.0" width="224.0" height="44.0" rx="10" fill="#ff5470" fill-opacity="0.06" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="568.0" y="185.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">DNS: сервер, запись, /etc/hosts</text><path d="M504.0 180.0 L550.0 180.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="527.0" y="173.0" fill="#ff5470" font-size="10" font-weight="600" text-anchor="middle">нет</text><path d="M120.0 210.0 L120.0 226.0" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-violet)"/><text x="132.0" y="222.0" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="start">да</text><rect x="30.0" y="228.0" width="470.0" height="56.0" rx="10" fill="#ffb84d" fill-opacity="0.08" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="252.0" fill="#ffb84d" font-size="13" font-weight="700" text-anchor="start">3. Открывается ли порт</text><text x="44.0" y="271.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">nc -zv site.ru 443 · curl -v https://site.ru</text><rect x="556.0" y="234.0" width="224.0" height="44.0" rx="10" fill="#ff5470" fill-opacity="0.06" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="568.0" y="261.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">файрвол, сервис не слушает, TLS</text><path d="M504.0 256.0 L550.0 256.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="527.0" y="249.0" fill="#ff5470" font-size="10" font-weight="600" text-anchor="middle">нет</text><path d="M120.0 286.0 L120.0 302.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="132.0" y="298.0" fill="#ffb84d" font-size="10" font-weight="700" text-anchor="start">да</text><rect x="30.0" y="304.0" width="470.0" height="56.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="328.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">4. Что отвечает сервис</text><text x="44.0" y="347.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">ss -tlnp · journalctl -u nginx</text><rect x="556.0" y="310.0" width="224.0" height="44.0" rx="10" fill="#ff5470" fill-opacity="0.06" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="568.0" y="337.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">логи приложения и прокси</text><path d="M504.0 332.0 L550.0 332.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="527.0" y="325.0" fill="#ff5470" font-size="10" font-weight="600" text-anchor="middle">нет</text><text x="30.0" y="378.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">Не перепрыгивай: если нет сети (шаг 1), смотреть логи nginx бессмысленно.</text></svg>
