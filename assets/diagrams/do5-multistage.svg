<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Multi-stage build"><title>Multi-stage build</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="330" rx="16" fill="#0b1017"/><rect width="800" height="330" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Multi-stage build</text><text x="38" y="57" fill="#7f91a3" font-size="12">в итоговый образ попадает только последний этап</text><rect x="20.0" y="80.0" width="330.0" height="190.0" rx="10" fill="#ffb84d" fill-opacity="0.06" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="104.0" fill="#ffb84d" font-size="13" font-weight="700" text-anchor="start">этап builder</text><text x="34.0" y="123.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">FROM python:3.13-slim AS builder</text><text x="34.0" y="140.0" fill="#ffb84d" font-size="11" font-weight="400" text-anchor="start">+ gcc, build-essential</text><text x="34.0" y="157.0" fill="#ffb84d" font-size="11" font-weight="400" text-anchor="start">+ заголовки libpq</text><text x="34.0" y="174.0" fill="#ffb84d" font-size="11" font-weight="400" text-anchor="start">+ кеш pip, исходники</text><text x="34.0" y="191.0" fill="#39ff88" font-size="11" font-weight="400" text-anchor="start">→ /venv с готовыми пакетами</text><rect x="36.0" y="241.2" width="236.5" height="21.5" rx="6" fill="#ffb84d" fill-opacity="0.12" stroke="#ffb84d" stroke-width="1.2"/><text x="154.2" y="255.8" fill="#ffb84d" font-size="10.5" font-weight="700" text-anchor="middle">~1.1 ГБ · остаётся на машине сборки</text><path d="M354.0 175.0 L446.0 175.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text x="400.0" y="152.0" fill="#39ff88" font-size="10" font-weight="700" text-anchor="middle">COPY --from=</text><text x="400.0" y="166.0" fill="#39ff88" font-size="10" font-weight="700" text-anchor="middle">builder /venv</text><rect x="450.0" y="80.0" width="330.0" height="190.0" rx="10" fill="#39ff88" fill-opacity="0.06" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="464.0" y="104.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">итоговый образ</text><text x="464.0" y="123.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">FROM python:3.13-slim</text><text x="464.0" y="140.0" fill="#39ff88" font-size="11" font-weight="400" text-anchor="start">+ /venv</text><text x="464.0" y="157.0" fill="#39ff88" font-size="11" font-weight="400" text-anchor="start">+ код приложения</text><text x="464.0" y="174.0" fill="#2de2e6" font-size="11" font-weight="400" text-anchor="start">USER app (не root)</text><text x="464.0" y="191.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">нет компилятора — меньше уязвимостей</text><rect x="466.0" y="241.2" width="148.3" height="21.5" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.2"/><text x="540.1" y="255.8" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="middle">~180 МБ · едет в прод</text><text x="20.0" y="306.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">Меньше образ — быстрее pull, меньше поверхность атаки, чище отчёт сканера.</text></svg>
