h="1.2"/><text x="629.0" y="226.0" fill="#7f91a3" font-size="9" font-weight="400" text-anchor="middle">0.5</text><rect x="660.0" y="124.0" width="34.0" height="88.0" rx="3" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1.2"/><text x="677.0" y="226.0" fill="#7f91a3" font-size="9" font-weight="400" text-anchor="middle">1</text><rect x="708.0" y="116.0" width="34.0" height="96.0" rx="3" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1.2"/><text x="725.0" y="226.0" fill="#7f91a3" font-size="9" font-weight="400" text-anchor="middle">+Inf</text><text x="546.0" y="248.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">раскладывает по корзинам</text><text x="546.0" y="268.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">..._seconds_bucket</text><text x="546.0" y="288.0" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="start">→ перцентили</text></svg>
