<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Одна конфигурация на все окружения"><title>Одна конфигурация на все окружения</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="340" rx="16" fill="#0b1017"/><rect width="800" height="340" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Одна конфигурация на все окружения</text><text x="38" y="57" fill="#7f91a3" font-size="12">общий файл плюс тонкие слои правок</text><rect x="250.0" y="76.0" width="300.0" height="62.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="264.0" y="100.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">docker-compose.yml</text><text x="264.0" y="118.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">общее: сервисы, сети, образы</text><rect x="20.0" y="186.0" width="330.0" height="80.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="210.0" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start">+ compose.override.yml</text><text x="34.0" y="228.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">подхватывается сам</text><text x="34.0" y="245.0" fill="#d8e3ea" font-size="10.5" font-weight="400" text-anchor="start">код смонтирован, порт базы наружу</text><rect x="450.0" y="186.0" width="330.0" height="80.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="464.0" y="210.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">+ compose.prod.yml</text><text x="464.0" y="228.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">явно через -f</text><text x="464.0" y="245.0" fill="#d8e3ea" font-size="10.5" font-weight="400" text-anchor="start">реплики, лимиты, restart: always</text><path d="M330.0 140.0 L185.0 182.0" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-violet)"/><path d="M470.0 140.0 L615.0 182.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="20" y="280" width="330" height="34" rx="8" fill="#070b10" stroke="#3a4b60" stroke-width="1"/><text x="32.0" y="301.0" fill="#a78bfa" font-size="11" font-weight="400" text-anchor="start">docker compose up -d</text><rect x="450" y="280" width="330" height="51.0" rx="8" fill="#070b10" stroke="#3a4b60" stroke-width="1"/><text x="462.0" y="300.5" fill="#39ff88" font-size="10.5" font-weight="400" text-anchor="start">docker compose -f docker-compose.yml \</text><text x="462.0" y="318.0" fill="#39ff88" font-size="10.5" font-weight="400" text-anchor="start">  -f compose.prod.yml up -d</text><rect x="556.0" y="96.5" width="226.0" height="21.0" rx="6" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.2"/><text x="669.0" y="110.6" fill="#ff5470" font-size="10" font-weight="700" text-anchor="middle">.env с секретами — не в репозитории</text></svg>
