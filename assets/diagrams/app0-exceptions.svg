<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Как летит исключение"><title>Как летит исключение</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="350" rx="16" fill="#0b1017"/><rect width="800" height="350" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Как летит исключение</text><text x="38" y="57" fill="#7f91a3" font-size="12">try / except / else / finally</text><rect x="30.0" y="80.0" width="200.0" height="52.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="104.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">try:</text><text x="44.0" y="122.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">with open(...) as f</text><rect x="30.0" y="176.0" width="200.0" height="44.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="204.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">else:</text><rect x="30.0" y="262.0" width="200.0" height="44.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="44.0" y="290.0" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start">finally:</text><text x="30.0" y="328.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">finally выполнится всегда: закрыть файл, соединение</text><path d="M130.0 134.0 L130.0 172.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text x="140.0" y="158.0" fill="#39ff88" font-size="11" font-weight="600" text-anchor="start">без ошибок</text><path d="M130.0 222.0 L130.0 258.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M234.0 106.0 L330.0 106.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="282.0" y="98.0" fill="#ff5470" font-size="11" font-weight="600" text-anchor="middle">исключение</text><rect x="334.0" y="80.0" width="210.0" height="52.0" rx="10" fill="#ffb84d" fill-opacity="0.08" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="348.0" y="104.0" fill="#ffb84d" font-size="12" font-weight="700" text-anchor="start">есть подходящий</text><text x="348.0" y="124.0" fill="#ffb84d" font-size="12" font-weight="400" text-anchor="start">except?</text><path d="M440.0 134.0 L440.0 172.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text x="450.0" y="158.0" fill="#39ff88" font-size="11" font-weight="600" text-anchor="start">да</text><rect x="334.0" y="176.0" width="210.0" height="44.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="348.0" y="203.0" fill="#39ff88" font-size="11.5" font-weight="700" text-anchor="start">except FileNotFoundError:</text><path d="M334 198 C280 198 280 284 236 284" fill="none" stroke="#39ff88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M548.0 106.0 L600.0 106.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="574.0" y="98.0" fill="#ff5470" font-size="11" font-weight="600" text-anchor="middle">нет</text><rect x="604.0" y="80.0" width="176.0" height="52.0" rx="10" fill="#ff5470" fill-opacity="0.08" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="618.0" y="104.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">летит выше</text><text x="618.0" y="122.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">по стеку вызовов</text><path d="M692.0 134.0 L692.0 172.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><rect x="604.0" y="176.0" width="176.0" height="64.0" rx="10" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="618.0" y="200.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">никто не поймал</text><text x="618.0" y="218.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">traceback,</text><text x="618.0" y="235.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">программа падает</text><text x="334.0" y="262.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="start">Лови конкретные исключения.</text><text x="334.0" y="280.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">Голый except: прячет ошибки,</text><text x="334.0" y="296.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">которые надо было увидеть.</text></svg>
