<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="RBAC: кто что может в API кластера"><title>RBAC: кто что может в API кластера</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="320" rx="16" fill="#0b1017"/><rect width="800" height="320" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">RBAC: кто что может в API кластера</text><text x="38" y="57" fill="#7f91a3" font-size="12">права выдаются учётке пода через связку Role и RoleBinding</text><rect x="20.0" y="90.0" width="130.0" height="60.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="114.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">Pod</text><text x="34.0" y="133.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">app</text><rect x="180.0" y="90.0" width="160.0" height="60.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="194.0" y="114.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">ServiceAccount</text><text x="194.0" y="133.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">app-reader</text><rect x="370.0" y="90.0" width="140.0" height="60.0" rx="10" fill="#ffb84d" fill-opacity="0.08" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="384.0" y="114.0" fill="#ffb84d" font-size="13" font-weight="700" text-anchor="start">RoleBinding</text><text x="384.0" y="133.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">связывает</text><rect x="540.0" y="90.0" width="240.0" height="60.0" rx="10" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="554.0" y="114.0" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start">Role</text><text x="554.0" y="133.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">configmap-reader</text><path d="M152.0 120.0 L176.0 120.0" fill="none" stroke="#2de2e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><path d="M342.0 120.0 L366.0 120.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M512.0 120.0 L536.0 120.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><rect x="540" y="162" width="240" height="68.5" rx="8" fill="#070b10" stroke="#3a4b60" stroke-width="1"/><text x="552.0" y="182.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">rules:</text><text x="552.0" y="200.0" fill="#d8e3ea" font-size="10.5" font-weight="400" text-anchor="start">  resources: [configmaps]</text><text x="552.0" y="217.5" fill="#d8e3ea" font-size="10.5" font-weight="400" text-anchor="start">  verbs: [get, list]</text><rect x="20.0" y="196.0" width="300.0" height="92.0" rx="10" fill="#d8e3ea" fill-opacity="0.04" stroke="#d8e3ea" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="220.0" fill="#d8e3ea" font-size="13" font-weight="700" text-anchor="start">API-сервер</text><text x="34.0" y="239.0" fill="#39ff88" font-size="11" font-weight="400" text-anchor="start">GET configmaps  → 200 ✓</text><text x="34.0" y="256.0" fill="#ff5470" font-size="11" font-weight="400" text-anchor="start">GET secrets     → 403 ✗</text><text x="34.0" y="273.0" fill="#ff5470" font-size="11" font-weight="400" text-anchor="start">DELETE pods     → 403 ✗</text><text x="340.0" y="268.0" fill="#d8e3ea" font-size="10.5" font-weight="400" text-anchor="start">Принцип наименьших прав: учётка default</text><text x="340.0" y="284.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">без нужды не должна уметь ничего.</text></svg>
