<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Секреты в пайплайне"><title>Секреты в пайплайне</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="340" rx="16" fill="#0b1017"/><rect width="800" height="340" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Секреты в пайплайне</text><text x="38" y="57" fill="#7f91a3" font-size="12">ключ на раннере доступен любому job, переменная проекта — только нужным</text><rect x="20.0" y="76.0" width="370.0" height="220.0" rx="10" fill="#ff5470" fill-opacity="0.04" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="100.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">✘ ключ лежит на раннере</text><rect x="40.0" y="120.0" width="160.0" height="46.0" rx="10" fill="#ff5470" fill-opacity="0.1" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="54.0" y="148.0" fill="#ff5470" font-size="11" font-weight="700" text-anchor="start">~/.ssh/deploy_key</text><rect x="40.0" y="195.2" width="85.3" height="21.5" rx="6" fill="#2de2e6" fill-opacity="0.12" stroke="#2de2e6" stroke-width="1.2"/><text x="82.7" y="209.8" fill="#2de2e6" font-size="10.5" font-weight="700" text-anchor="middle">job из main</text><path d="M120.0 194.0 L120.0 168.0" fill="none" stroke="#2de2e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><rect x="40.0" y="239.2" width="116.8" height="21.5" rx="6" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.2"/><text x="98.4" y="253.8" fill="#ff5470" font-size="10.5" font-weight="700" text-anchor="middle">job из чужого MR</text><path d="M140.0 238.0 L140.0 168.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text x="232.0" y="150.0" fill="#ff5470" font-size="11" font-weight="700" text-anchor="start">читают все</text><text x="232.0" y="166.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">job на раннере</text><rect x="410.0" y="76.0" width="370.0" height="220.0" rx="10" fill="#39ff88" fill-opacity="0.04" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="424.0" y="100.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">✔ переменная CI/CD</text><rect x="430.0" y="116.0" width="330.0" height="60.0" rx="10" fill="#39ff88" fill-opacity="0.1" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="444.0" y="140.0" fill="#39ff88" font-size="11.5" font-weight="700" text-anchor="start">Settings → CI/CD → Variables</text><text x="444.0" y="158.5" fill="#39ff88" font-size="10.5" font-weight="400" text-anchor="start">SSH_PRIVATE_KEY · masked · protected</text><rect x="430.0" y="203.2" width="160.9" height="21.5" rx="6" fill="#2de2e6" fill-opacity="0.12" stroke="#2de2e6" stroke-width="1.2"/><text x="510.4" y="217.8" fill="#2de2e6" font-size="10.5" font-weight="700" text-anchor="middle">job из main (protected)</text><path d="M530.0 200.0 L530.0 180.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M620.0 214.0 L690.0 214.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="694.0" y="196.0" width="76.0" height="36.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="708.0" y="219.0" fill="#39ff88" font-size="11" font-weight="700" text-anchor="start">сервер</text><rect x="430.0" y="247.2" width="173.5" height="21.5" rx="6" fill="#7f91a3" fill-opacity="0.12" stroke="#7f91a3" stroke-width="1.2"/><text x="516.8" y="261.8" fill="#7f91a3" font-size="10.5" font-weight="700" text-anchor="middle">job из MR: переменной нет</text><text x="20.0" y="324.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">masked — значение скрыто в логах, protected — доступно только защищённым веткам и тегам.</text></svg>
