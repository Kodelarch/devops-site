arker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="330" rx="16" fill="#0b1017"/><rect width="800" height="330" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Лимиты ресурсов контейнеров</text><text x="38" y="57" fill="#7f91a3" font-size="12">без лимитов утечка в одном сервисе кладёт соседей</text><rect x="20.0" y="76.0" width="370.0" height="214.0" rx="10" fill="#ff5470" fill-opacity="0.04" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="100.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">хост 4 ГБ · без лимитов</text><rect x="40.0" y="130.0" width="330.0" height="34.0" rx="6" fill="#3a4b60" fill-opacity="0.25" stroke="#3a4b60" stroke-width="1"/><rect x="40.0" y="130.0" width="277.2" height="34.0" rx="6" fill="#ff5470" fill-opacity="0.45" stroke="#ff5470" stroke-width="1"/><text x="50.0" y="152.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="start">app: утечка 3.4 ГБ</text><rect x="317.2" y="130.0" width="52.8" height="34.0" rx="6" fill="#2de2e6" fill-opacity="0.4" stroke="#2de2e6" stroke-width="1"/><text x="323.8" y="152.0" fill="#d8e3ea" font-size="10" font-weight="700" text-anchor="start">db</text><text x="40.0" y="196.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">OOM killer выбирает жертву:</text><rect x="40.0" y="211.0" width="115.0" height="22.0" rx="6" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.2"/><text x="97.5" y="226.0" fill="#ff5470" font-size="11" font-weight="700" text-anchor="middle">postgres убит ✗</text><text x="40.0" y="260.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">виноват app, пострадала база</text><rect x="410.0" y="76.0" width="370.0" height="214.0" rx="10" fill="#39ff88" fill-opacity="0.04" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="424.0" y="100.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">хост 4 ГБ · memory: 512M</text><rect x="430.0" y="130.0" width="330.0" height="34.0" rx="6" fill="#3a4b60" fill-opacity="0.25" stroke="#3a4b60" stroke-width="1"/><rect x="430.0" y="130.0" width="42.9" height="34.0" rx="6" fill="#ffb84d" fill-opacity="0.5" stroke="#ffb84d" stroke-width="1"/><text x="436.0" y="152.0" fill="#d8e3ea" font-size="10" font-weight="700" text-anchor="start">app</text><rect x="472.9" y="130.0" width="99.0" height="34.0" rx="6" fill="#2de2e6" fill-opacity="0.4" stroke="#2de2e6" stroke-width="1"/><text x="479.5" y="152.0" fill="#d8e3ea" font-size="10" font-weight="700" text-anchor="start">db</text><path d="M472.9 124.0 L472.9 170.0" fill="none" stroke="#ffb84d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="430.0" y="196.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">app упёрся в свой лимит:</text><rect x="430.0" y="211.0" width="161.2" height="22.0" rx="6" fill="#ffb84d" fill-opacity="0.12" stroke="#ffb84d" stroke-width="1.2"/><text x="510.6" y="226.0" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="middle">перезапущен только app</text><rect x="630.0" y="211.0" width="75.4" height="22.0" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.2"/><text x="667.7" y="226.0" fill="#39ff88" font-size="11" font-weight="700" text-anchor="middle">db жива ✓</text><text x="430.0" y="260.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">авария не выходит за контейнер</text><text x="20.0" y="316.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">Лимит памяти ставят всегда; по CPU — ограничение и резерв (reservations) для важных сервисов.</text></svg>
