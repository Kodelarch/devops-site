<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Deployment против StatefulSet"><title>Deployment против StatefulSet</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="350" rx="16" fill="#0b1017"/><rect width="800" height="350" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Deployment против StatefulSet</text><text x="38" y="57" fill="#7f91a3" font-size="12">у базы есть состояние, поэтому её поды не взаимозаменяемы</text><rect x="20.0" y="76.0" width="340.0" height="238.0" rx="10" fill="#2de2e6" fill-opacity="0.04" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="100.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">Deployment</text><text x="34.0" y="119.5" fill="#7f91a3" font-size="11.5" font-weight="400" text-anchor="start">поды одинаковые и сменные</text><rect x="40.0" y="140.0" width="180.0" height="40.0" rx="10" fill="#2de2e6" fill-opacity="0.1" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="54.0" y="165.0" fill="#2de2e6" font-size="11" font-weight="700" text-anchor="start">web-7d9f-x2k4q</text><rect x="40.0" y="192.0" width="180.0" height="40.0" rx="10" fill="#2de2e6" fill-opacity="0.1" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="54.0" y="217.0" fill="#2de2e6" font-size="11" font-weight="700" text-anchor="start">web-7d9f-q8m1z</text><rect x="40.0" y="244.0" width="180.0" height="40.0" rx="10" fill="#2de2e6" fill-opacity="0.1" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="54.0" y="269.0" fill="#2de2e6" font-size="11" font-weight="700" text-anchor="start">web-7d9f-z4c7n</text><text x="236.0" y="180.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">имена случайные,</text><text x="236.0" y="196.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">любой обслужит</text><text x="236.0" y="212.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">любой запрос</text><rect x="380.0" y="76.0" width="400.0" height="238.0" rx="10" fill="#a78bfa" fill-opacity="0.04" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="394.0" y="100.0" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="start">StatefulSet</text><text x="394.0" y="119.5" fill="#7f91a3" font-size="11.5" font-weight="400" text-anchor="start">у каждого пода своё имя и свой диск</text><rect x="400.0" y="140.0" width="90.0" height="40.0" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="414.0" y="165.0" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="start">pg-0</text><path d="M494.0 160.0 L520.0 160.0" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-violet)"/><rect x="524.0" y="140.0" width="110.0" height="40.0" rx="10" fill="#ffb84d" fill-opacity="0.1" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="538.0" y="165.0" fill="#ffb84d" font-size="10.5" font-weight="700" text-anchor="start">data-pg-0</text><text x="648.0" y="164.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">pg-0.pg-headless</text><rect x="400.0" y="192.0" width="90.0" height="40.0" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="414.0" y="217.0" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="start">pg-1</text><path d="M494.0 212.0 L520.0 212.0" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-violet)"/><rect x="524.0" y="192.0" width="110.0" height="40.0" rx="10" fill="#ffb84d" fill-opacity="0.1" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="538.0" y="217.0" fill="#ffb84d" font-size="10.5" font-weight="700" text-anchor="start">data-pg-1</text><text x="648.0" y="216.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">pg-1.pg-headless</text><rect x="400.0" y="244.0" width="90.0" height="40.0" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)"/><text x="414.0" y="269.0" fill="#a78bfa" font-size="12" font-weight="700" text-anchor="start">pg-2</text><path d="M494.0 264.0 L520.0 264.0" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-violet)"/><rect x="524.0" y="244.0" width="110.0" height="40.0" rx="10" fill="#ffb84d" fill-opacity="0.1" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="538.0" y="269.0" fill="#ffb84d" font-size="10.5" font-weight="700" text-anchor="start">data-pg-2</text><text x="648.0" y="268.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">pg-2.pg-headless</text><text x="400.0" y="300.0" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="start">старт по порядку: pg-0 → pg-1 → pg-2</text><text x="20.0" y="336.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">Под pg-1 после пересоздания получит тот же диск data-pg-1 и то же DNS-имя.</text></svg>
