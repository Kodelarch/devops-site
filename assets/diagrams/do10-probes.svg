<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Три пробы Kubernetes"><title>Три пробы Kubernetes</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="340" rx="16" fill="#0b1017"/><rect width="800" height="340" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Три пробы Kubernetes</text><text x="38" y="57" fill="#7f91a3" font-size="12">три разных вопроса — три разных действия</text><rect x="20.0" y="80.0" width="230.0" height="60.0" rx="10" fill="#ffb84d" fill-opacity="0.08" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="104.0" fill="#ffb84d" font-size="13" font-weight="700" text-anchor="start">startupProbe</text><text x="34.0" y="123.5" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">запустилось?</text><text x="268.0" y="106.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">пока нет — остальные пробы ждут</text><path d="M266.0 120.0 L466.0 120.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><rect x="470.0" y="94.0" width="310.0" height="42.0" rx="10" fill="#ffb84d" fill-opacity="0.06" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="484.0" y="120.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="start">провал дольше лимита → перезапуск</text><rect x="20.0" y="156.0" width="230.0" height="60.0" rx="10" fill="#ff5470" fill-opacity="0.08" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="180.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">livenessProbe</text><text x="34.0" y="199.5" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">не завис?</text><text x="268.0" y="182.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">внешнее не проверять!</text><path d="M266.0 196.0 L466.0 196.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><rect x="470.0" y="170.0" width="310.0" height="42.0" rx="10" fill="#ff5470" fill-opacity="0.06" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="484.0" y="196.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="start">провал → перезапуск контейнера</text><rect x="20.0" y="232.0" width="230.0" height="60.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="256.0" fill="#2de2e6" font-size="13" font-weight="700" text-anchor="start">readinessProbe</text><text x="34.0" y="275.5" fill="#d8e3ea" font-size="11.5" font-weight="400" text-anchor="start">можно слать трафик?</text><text x="268.0" y="258.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">проверяет базу, кеш, очередь</text><path d="M266.0 272.0 L466.0 272.0" fill="none" stroke="#2de2e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/><rect x="470.0" y="246.0" width="310.0" height="42.0" rx="10" fill="#2de2e6" fill-opacity="0.06" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="484.0" y="272.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="start">провал → убрать из Service, не трогать</text><text x="20.0" y="322.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">Ошибка-классика: liveness проверяет базу — база ушла на обслуживание, и все поды перезапускаются по кругу.</text></svg>
