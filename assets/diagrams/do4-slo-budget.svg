r><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="360" rx="16" fill="#0b1017"/><rect width="800" height="360" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">SLI, SLO, SLA и бюджет ошибок</text><text x="38" y="57" fill="#7f91a3" font-size="12">SLO 99.9% в месяц = около 43 минут допустимого простоя</text><rect x="60.0" y="96.0" width="680.0" height="16.0" rx="8" fill="#3a4b60" fill-opacity="0.4" stroke="#3a4b60" stroke-width="1"/><circle cx="400.0" cy="104" r="7" fill="#ff5470" fill-opacity="0.6" stroke="#ff5470" stroke-width="1.8" filter="url(#glow)"/><text x="400.0" y="88.0" fill="#ff5470" font-size="11" font-weight="700" text-anchor="middle">SLA 99.5% — договор со штрафами</text><circle cx="672.0000000000039" cy="104" r="7" fill="#ffb84d" fill-opacity="0.6" stroke="#ffb84d" stroke-width="1.8" filter="url(#glow)"/><text x="672.0" y="132.0" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="end">SLO 99.9% — цель команды</text><circle cx="706.0000000000019" cy="104" r="7" fill="#39ff88" fill-opacity="0.6" stroke="#39ff88" stroke-width="1.8" filter="url(#glow)"/><text x="706.0" y="88.0" fill="#39ff88" font-size="11" font-weight="700" text-anchor="end">SLI 99.95% — факт</text><text x="60.0" y="132.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">99%</text><text x="740.0" y="88.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="end">100%</text><path d="M60.0 168.0 L60.0 298.0 L740.0 298.0" fill="none" stroke="#3a4b60" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="54.0" y="160.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="start">остаток бюджета, мин</text><text x="52.0" y="174.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="end">43</text><text x="52.0" y="298.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="end">0</text><path d="M60 168 L220 178 L230 228 L440 242 L452 286 L580 294 L590 298" fill="none" stroke="#ffb84d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="236.0" y="220.0" fill="#ff5470" font-size="10" font-weight="400" text-anchor="start">инцидент −16 мин</text><text x="460.0" y="280.0" fill="#ff5470" font-size="10" font-weight="400" text-anchor="start">инцидент −14 мин</text><rect x="290.0" y="175.2" width="192.4" height="21.5" rx="6" fill="#39ff88" fill-opacity="0.12" stroke="#39ff88" stroke-width="1.2"/><text x="386.2" y="189.8" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="middle">бюджет есть → выпускаем фичи</text><rect x="490.0" y="251.2" width="205.0" height="21.5" rx="6" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.2"/><text x="592.5" y="265.8" fill="#ff5470" font-size="10.5" font-weight="700" text-anchor="middle">кончился → только стабильность</text><text x="60.0" y="340.0" fill="#7f91a3" font-size="11" font-weight="400" text-anchor="start">SLA ставят ниже SLO: команда видит нарушение своей цели раньше, чем нарушит договор.</text><