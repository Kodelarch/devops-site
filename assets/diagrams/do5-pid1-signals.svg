<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Кто такой PID 1 и почему важна форма CMD"><title>Кто такой PID 1 и почему важна форма CMD</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="350" rx="16" fill="#0b1017"/><rect width="800" height="350" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Кто такой PID 1 и почему важна форма CMD</text><text x="38" y="57" fill="#7f91a3" font-size="12">docker stop шлёт SIGTERM в PID 1, через 10 с — SIGKILL</text><rect x="30.0" y="85.0" width="88.6" height="22.0" rx="6" fill="#d8e3ea" fill-opacity="0.12" stroke="#d8e3ea" stroke-width="1.2"/><text x="74.3" y="100.0" fill="#d8e3ea" font-size="11" font-weight="700" text-anchor="middle">docker stop</text><path d="M130.0 96.0 L180.0 96.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="155.0" y="88.0" fill="#ffb84d" font-size="11" font-weight="600" text-anchor="middle">SIGTERM</text><text x="30.0" y="136.0" fill="#ff5470" font-size="12" font-weight="700" text-anchor="start">shell-форма</text><rect x="30" y="146" width="210" height="34" rx="8" fill="#070b10" stroke="#3a4b60" stroke-width="1"/><text x="42.0" y="167.0" fill="#ff5470" font-size="11" font-weight="400" text-anchor="start">CMD python app.py</text><rect x="280.0" y="136.0" width="170.0" height="56.0" rx="10" fill="#ff5470" fill-opacity="0.08" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="294.0" y="160.0" fill="#ff5470" font-size="13" font-weight="700" text-anchor="start">PID 1</text><text x="294.0" y="179.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">/bin/sh -c ...</text><path d="M244.0 164.0 L276.0 164.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><path d="M454.0 164.0 L520.0 164.0" fill="none" stroke="#ff5470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="487.0" y="157.0" fill="#ff5470" font-size="10" font-weight="600" text-anchor="middle">не передаёт</text><rect x="524.0" y="136.0" width="256.0" height="56.0" rx="10" fill="#ff5470" fill-opacity="0.08" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="538.0" y="160.0" fill="#ff5470" font-size="11.5" font-weight="700" text-anchor="start">app (PID 7) сигнал не видит</text><text x="538.0" y="178.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">через 10 с SIGKILL → обрыв ✗</text><text x="30.0" y="236.0" fill="#39ff88" font-size="12" font-weight="700" text-anchor="start">exec-форма</text><rect x="30" y="246" width="210" height="34" rx="8" fill="#070b10" stroke="#3a4b60" stroke-width="1"/><text x="42.0" y="267.0" fill="#39ff88" font-size="11" font-weight="400" text-anchor="start">CMD [&quot;python&quot;, &quot;app.py&quot;]</text><rect x="280.0" y="236.0" width="170.0" height="56.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="294.0" y="260.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">PID 1</text><text x="294.0" y="279.0" fill="#d8e3ea" font-size="11" font-weight="400" text-anchor="start">python app.py</text><path d="M244.0 264.0 L276.0 264.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><path d="M454.0 264.0 L520.0 264.0" fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text x="487.0" y="257.0" fill="#39ff88" font-size="10" font-weight="600" text-anchor="middle">получил</text><rect x="524.0" y="236.0" width="256.0" height="56.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="538.0" y="260.0" fill="#39ff88" font-size="13" font-weight="700" text-anchor="start">корректное завершение ✓</text><text x="538.0" y="278.5" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">дообработал запросы, закрыл БД</text><text x="30.0" y="336.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="start">Shell-форма запускает приложение через sh, а sh не пересылает сигналы — пиши exec-форму или используй tini.</text></svg>
