<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Пирамида тестов"><title>Пирамида тестов</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="330" rx="16" fill="#0b1017"/><rect width="800" height="330" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Пирамида тестов</text><text x="38" y="57" fill="#7f91a3" font-size="12">много быстрых внизу, мало медленных наверху</text><path d="M310.0 82.0 L350.0 82.0 L433.3333333333333 150.0 L226.66666666666669 150.0 Z" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M310.0 82.0 L350.0 82.0 L433.3333333333333 150.0 L226.66666666666669 150.0 Z" fill="#0b1017" fill-opacity=".78"/><text x="330.0" y="116.0" fill="#a78bfa" font-size="12.5" font-weight="700" text-anchor="middle">E2E: весь CLI целиком</text><text x="330.0" y="132.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="middle">мало, медленно</text><path d="M226.66666666666669 154.0 L433.3333333333333 154.0 L516.6666666666666 222.0 L143.33333333333334 222.0 Z" fill="#2de2e6" stroke="#2de2e6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M226.66666666666669 154.0 L433.3333333333333 154.0 L516.6666666666666 222.0 L143.33333333333334 222.0 Z" fill="#0b1017" fill-opacity=".78"/><text x="330.0" y="188.0" fill="#2de2e6" font-size="12.5" font-weight="700" text-anchor="middle">интеграционные</text><text x="330.0" y="204.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="middle">файл, HTTP-заглушка</text><path d="M143.33333333333334 226.0 L516.6666666666666 226.0 L600.0 294.0 L60.0 294.0 Z" fill="#39ff88" stroke="#39ff88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M143.33333333333334 226.0 L516.6666666666666 226.0 L600.0 294.0 L60.0 294.0 Z" fill="#0b1017" fill-opacity=".78"/><text x="330.0" y="260.0" fill="#39ff88" font-size="12.5" font-weight="700" text-anchor="middle">юнит-тесты домена</text><text x="330.0" y="276.0" fill="#7f91a3" font-size="10.5" font-weight="400" text-anchor="middle">много, миллисекунды</text><path d="M640.0 290.0 L640.0 96.0" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><text x="656.0" y="110.0" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="start">дороже,</text><text x="656.0" y="126.0" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="start">медленнее,</text><text x="656.0" y="142.0" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="start">хрупче</text><text x="656.0" y="270.0" fill="#39ff88" font-size="11" font-weight="700" text-anchor="start">быстрее,</text><text x="656.0" y="286.0" fill="#39ff88" font-size="11" font-weight="700" text-anchor="start">больше</text></svg>
