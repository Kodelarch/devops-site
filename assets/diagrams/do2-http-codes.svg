<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Коды ответов HTTP"><title>Коды ответов HTTP</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="330" rx="16" fill="#0b1017"/><rect width="800" height="330" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Коды ответов HTTP</text><text x="38" y="57" fill="#7f91a3" font-size="12">первая цифра сразу говорит, где искать проблему</text><rect x="20.0" y="78.0" width="182.0" height="196.0" rx="10" fill="#39ff88" fill-opacity="0.08" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="102.0" fill="#39ff88" font-size="12" font-weight="700" text-anchor="start">2xx · успех</text><text x="34.0" y="130.0" fill="#39ff88" font-size="13" font-weight="800" text-anchor="start">200</text><text x="68.0" y="130.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">OK</text><text x="34.0" y="158.0" fill="#39ff88" font-size="13" font-weight="800" text-anchor="start">201</text><text x="68.0" y="158.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">Created</text><text x="34.0" y="186.0" fill="#39ff88" font-size="13" font-weight="800" text-anchor="start">204</text><text x="68.0" y="186.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">No Content</text><rect x="212.0" y="78.0" width="182.0" height="196.0" rx="10" fill="#2de2e6" fill-opacity="0.08" stroke="#2de2e6" stroke-width="1.6" filter="url(#glow)"/><text x="226.0" y="102.0" fill="#2de2e6" font-size="12" font-weight="700" text-anchor="start">3xx · перенаправление</text><text x="226.0" y="130.0" fill="#2de2e6" font-size="13" font-weight="800" text-anchor="start">301</text><text x="260.0" y="130.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">переехал навсегда</text><text x="226.0" y="158.0" fill="#2de2e6" font-size="13" font-weight="800" text-anchor="start">302</text><text x="260.0" y="158.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">временно</text><text x="226.0" y="186.0" fill="#2de2e6" font-size="13" font-weight="800" text-anchor="start">304</text><text x="260.0" y="186.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">не изменилось</text><rect x="404.0" y="78.0" width="182.0" height="196.0" rx="10" fill="#ffb84d" fill-opacity="0.08" stroke="#ffb84d" stroke-width="1.6" filter="url(#glow)"/><text x="418.0" y="102.0" fill="#ffb84d" font-size="12" font-weight="700" text-anchor="start">4xx · ошибка клиента</text><text x="418.0" y="130.0" fill="#ffb84d" font-size="13" font-weight="800" text-anchor="start">400</text><text x="452.0" y="130.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">кривой запрос</text><text x="418.0" y="158.0" fill="#ffb84d" font-size="13" font-weight="800" text-anchor="start">401</text><text x="452.0" y="158.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">нужен вход</text><text x="418.0" y="186.0" fill="#ffb84d" font-size="13" font-weight="800" text-anchor="start">403</text><text x="452.0" y="186.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">нельзя</text><text x="418.0" y="214.0" fill="#ffb84d" font-size="13" font-weight="800" text-anchor="start">404</text><text x="452.0" y="214.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">нет такого</text><text x="418.0" y="242.0" fill="#ffb84d" font-size="13" font-weight="800" text-anchor="start">429</text><text x="452.0" y="242.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">слишком часто</text><rect x="596.0" y="78.0" width="182.0" height="196.0" rx="10" fill="#ff5470" fill-opacity="0.08" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="610.0" y="102.0" fill="#ff5470" font-size="12" font-weight="700" text-anchor="start">5xx · ошибка сервера</text><text x="610.0" y="130.0" fill="#ff5470" font-size="13" font-weight="800" text-anchor="start">500</text><text x="644.0" y="130.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">упало приложение</text><text x="610.0" y="158.0" fill="#ff5470" font-size="13" font-weight="800" text-anchor="start">502</text><text x="644.0" y="158.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">прокси не достучался</text><text x="610.0" y="186.0" fill="#ff5470" font-size="13" font-weight="800" text-anchor="start">503</text><text x="644.0" y="186.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">перегружен</text><text x="610.0" y="214.0" fill="#ff5470" font-size="13" font-weight="800" text-anchor="start">504</text><text x="644.0" y="214.0" fill="#d8e3ea" font-size="10" font-weight="400" text-anchor="start">приложение не успело</text><rect x="20.0" y="291.2" width="249.1" height="21.5" rx="6" fill="#ffb84d" fill-opacity="0.12" stroke="#ffb84d" stroke-width="1.2"/><text x="144.6" y="305.8" fill="#ffb84d" font-size="10.5" font-weight="700" text-anchor="middle">4xx — ищи в запросе: URL, токен, тело</text><rect x="392.0" y="291.2" width="305.8" height="21.5" rx="6" fill="#ff5470" fill-opacity="0.12" stroke="#ff5470" stroke-width="1.2"/><text x="544.9" y="305.8" fill="#ff5470" font-size="10.5" font-weight="700" text-anchor="middle">5xx — ищи на сервере: логи приложения и прокси</text></svg>
