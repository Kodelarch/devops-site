<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="vp1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2733" stroke-width="1"/>
    </pattern>
    <marker id="vpa" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#e08a4f"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#0e1620"/>
  <rect width="1000" height="470" fill="url(#vp1)" opacity="0.5"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#dce6ec">Типовая сеть в облаке</text>
  <text x="40" y="72" font-size="15" fill="#8a9aa8">Одна и та же схема во всех облаках — меняются только названия сущностей.</text>

  <rect x="40" y="96" width="920" height="290" rx="10" fill="none" stroke="#6bbdb6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="62" y="120" font-size="14" font-weight="650" fill="#6bbdb6">VPC — своя изолированная сеть · 10.0.0.0/16</text>

  <rect x="62" y="134" width="430" height="110" rx="9" fill="#16202b" stroke="#e08a4f" stroke-width="2"/>
  <text x="82" y="158" font-size="13.5" font-weight="650" fill="#e08a4f">Публичная подсеть · 10.0.1.0/24</text>
  <rect x="82" y="170" width="180" height="56" rx="6" fill="#101d2a" stroke="#2a3742"/>
  <text x="172" y="192" font-size="12.5" fill="#dce6ec" text-anchor="middle">балансировщик</text>
  <text x="172" y="212" font-size="11" fill="#8a9aa8" text-anchor="middle">публичный IP</text>
  <rect x="276" y="170" width="196" height="56" rx="6" fill="#101d2a" stroke="#2a3742"/>
  <text x="374" y="192" font-size="12.5" fill="#dce6ec" text-anchor="middle">NAT-шлюз</text>
  <text x="374" y="212" font-size="11" fill="#8a9aa8" text-anchor="middle">выпускает наружу, но не впускает</text>

  <rect x="62" y="256" width="430" height="112" rx="9" fill="#16202b" stroke="#6bbdb6" stroke-width="2"/>
  <text x="82" y="280" font-size="13.5" font-weight="650" fill="#6bbdb6">Приватная подсеть · 10.0.2.0/24</text>
  <rect x="82" y="292" width="180" height="60" rx="6" fill="#101d2a" stroke="#2a3742"/>
  <text x="172" y="316" font-size="12.5" fill="#dce6ec" text-anchor="middle">приложение</text>
  <text x="172" y="336" font-size="11" fill="#8a9aa8" text-anchor="middle">без публичного IP</text>
  <rect x="276" y="292" width="196" height="60" rx="6" fill="#101d2a" stroke="#2a3742"/>
  <text x="374" y="316" font-size="12.5" fill="#dce6ec" text-anchor="middle">база данных</text>
  <text x="374" y="336" font-size="11" fill="#8a9aa8" text-anchor="middle">снаружи недостижима вовсе</text>

  <line x1="374" y1="292" x2="374" y2="240" stroke="#e08a4f" stroke-width="2" marker-end="url(#vpa)"/>
  <text x="390" y="266" font-size="11" fill="#e08a4f">обновления, API</text>

  <rect x="520" y="134" width="420" height="110" rx="9" fill="#101d2a" stroke="#2a3742" stroke-width="1.5"/>
  <text x="542" y="158" font-size="14" font-weight="650" fill="#dce6ec">Группа безопасности</text>
  <text x="542" y="182" font-size="12.5" fill="#8a9aa8">Файрвол на уровне машины, а не хоста.</text>
  <text x="542" y="202" font-size="12.5" fill="#8a9aa8">По умолчанию входящее запрещено всё.</text>
  <text x="542" y="226" font-size="12.5" fill="#6bbdb6">Правила задаются не адресами, а ссылками на</text>
  <text x="542" y="240" font-size="12.5" fill="#6bbdb6">другие группы: «база пускает только приложение».</text>

  <rect x="520" y="256" width="420" height="112" rx="9" fill="#101d2a" stroke="#2a3742" stroke-width="1.5"/>
  <text x="542" y="280" font-size="14" font-weight="650" fill="#dce6ec">Зоны доступности</text>
  <text x="542" y="304" font-size="12.5" fill="#8a9aa8">Разные дата-центры одного региона.</text>
  <text x="542" y="324" font-size="12.5" fill="#8a9aa8">Подсети создают в каждой зоне,</text>
  <text x="542" y="344" font-size="12.5" fill="#8a9aa8">машины размещают минимум в двух —</text>
  <text x="542" y="362" font-size="12.5" fill="#6bbdb6">иначе отказ одного ДЦ кладёт весь сервис.</text>

  <rect x="40" y="404" width="920" height="52" rx="9" fill="#16202b" stroke="#e0574f" stroke-width="1.5"/>
  <text x="62" y="428" font-size="14" font-weight="650" fill="#e0574f">Правило, которое проверяют на собеседовании</text>
  <text x="62" y="448" font-size="13.5" fill="#dce6ec">Публичный IP есть только у того, к чему обращаются снаружи. База в публичной подсети — типовая ошибка и типовая утечка.</text>
</svg>
