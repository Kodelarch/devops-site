<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="Список против генератора"><title>Список против генератора</title><defs><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39ff88"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2e6"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-magenta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3ea5"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb84d"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5470"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e3ea"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f91a3"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a4b60"/></marker><marker id="a-bg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b1017"/></marker><marker id="a-panel" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111823"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#070b10"/></marker><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#39ff88" stroke-opacity=".05"/></pattern></defs><rect width="800" height="340" rx="16" fill="#0b1017"/><rect width="800" height="340" rx="16" fill="url(#grid)" stroke="#1f2b3a" stroke-width="1.5"/><rect x="24" y="20" width="4" height="40" rx="2" fill="#2de2e6" filter="url(#glow)"/><text x="38" y="37" fill="#d8e3ea" font-size="17" font-weight="800">Список против генератора</text><text x="38" y="57" fill="#7f91a3" font-size="12">на гигабайтном логе это разница между «работает» и OOM</text><rect x="20.0" y="76.0" width="370.0" height="120.0" rx="10" fill="#ff5470" fill-opacity="0.05" stroke="#ff5470" stroke-width="1.6" filter="url(#glow)"/><text x="34.0" y="100.0" fill="#ff5470" font-size="12" font-weight="700" text-anchor="start">[l for l in open(&quot;huge.log&quot;)]</text><text x="34.0" y="119.5" fill="#7f91a3" font-size="11.5" font-weight="400" text-anchor="start">весь файл сразу в память</text><rect x="410.0" y="76.0" width="370.0" height="120.0" rx="10" fill="#39ff88" fill-opacity="0.05" stroke="#39ff88" stroke-width="1.6" filter="url(#glow)"/><text x="424.0" y="100.0" fill="#39ff88" font-size="12" font-weight="700" text-anchor="start">(l for l in open(&quot;huge.log&quot;))</text><text x="424.0" y="119.5" fill="#7f91a3" font-size="11.5" font-weight="400" text-anchor="start">по одной строке за раз</text><rect x="36.0" y="140.0" width="338.0" height="20.0" rx="5" fill="#3a4b60" fill-opacity="0.3" stroke="#3a4b60" stroke-width="1"/><rect x="36.0" y="140.0" width="338.0" height="20.0" rx="5" fill="#ff5470" fill-opacity="0.5" stroke="#ff5470" stroke-width="1"/><text x="46.0" y="154.0" fill="#d8e3ea" font-size="10.5" font-weight="700" text-anchor="start">RAM: 20 ГБ из 16 ГБ → OOM killer ✗</text><rect x="426.0" y="140.0" width="338.0" height="20.0" rx="5" fill="#3a4b60" fill-opacity="0.3" stroke="#3a4b60" stroke-width="1"/><rect x="426.0" y="140.0" width="26.0" height="20.0" rx="5" fill="#39ff88" fill-opacity="0.6" stroke="#39ff88" stroke-width="1"/><text x="462.0" y="154.0" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="start">RAM: ~1 строка, постоянно ✓</text><path d="M70.0 214.0 L70.0 304.0 L750.0 304.0" fill="none" stroke="#3a4b60" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="62.0" y="218.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="end">память</text><text x="750.0" y="320.0" fill="#7f91a3" font-size="10" font-weight="400" text-anchor="end">время чтения файла →</text><path d="M70 304 L546.0 218" fill="none" stroke="#ff5470" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="554.0" y="222.0" fill="#ff5470" font-size="10.5" font-weight="700" text-anchor="start">список: растёт до падения</text><path d="M70 296 L750 296" fill="none" stroke="#39ff88" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="559.6" y="288.0" fill="#39ff88" font-size="10.5" font-weight="700" text-anchor="start">генератор: ровная линия</text></svg>
